name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    if: github.repository == 'TrustTunnel/homebrew-tap'
    runs-on: macos-latest

    permissions:
      contents: read

    env:
      HOMEBREW_NO_ENV_HINTS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history so the local `brew tap` clone below is not shallow.
          fetch-depth: 0
          # Do not leave the token in the checkout's git config. Untrusted
          # pull request code must not read it.
          persist-credentials: false

      # Bring our own Homebrew setup (no Homebrew/actions/setup-homebrew).
      - name: Set up Homebrew
        run: ./.github/scripts/setup-homebrew.sh

      # Homebrew requires a formula to live in a tap, so register the
      # checked-out repo as one. Deriving the tap name from github.repository
      # avoids hard-coding the owner.
      - name: Register the checkout as a tap
        run: |
          owner="${GITHUB_REPOSITORY%/*}"
          tap="${GITHUB_REPOSITORY#*/}"
          tap="${tap#homebrew-}"
          brew tap "${owner}/${tap}" "$GITHUB_WORKSPACE"
          echo "TAP=${owner}/${tap}" >> "$GITHUB_ENV"

      - name: Install formulas
        run: |
          brew install "${TAP}/trusttunnel"
          brew install "${TAP}/trusttunnel-client"

      - name: Test formulas
        run: |
          brew test "${TAP}/trusttunnel"
          brew test "${TAP}/trusttunnel-client"
